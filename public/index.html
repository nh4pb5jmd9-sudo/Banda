<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falò</title>
<style>
:root{
  --carbone:#1c1714;--pannello:#2a221d;--brace:#ff8a3d;--brace-scuro:#c85a1e;
  --crema:#f4e9dc;--sbiadito:#a8998a;--linea:#3d332c;--rosso:#ff6b5b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% -20%,#3a2a1f 0%,var(--carbone) 60%);color:var(--crema);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brace);outline-offset:3px}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-0.01em;margin:0}

/* ---------- ingresso ---------- */
#join{display:flex;align-items:center;justify-content:center;min-height:100%;padding:24px}
#join form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
#join .fiamma{font-size:56px;line-height:1;animation:ondeggia 3s ease-in-out infinite}
#join h1{font-size:40px}
#join .intro{margin:0 0 6px;color:var(--sbiadito);font-size:15px}
#join input{background:var(--pannello);border:1px solid var(--linea);border-radius:14px;padding:14px 16px;text-align:center}
#join input:focus{border-color:var(--brace)}
.bottone{background:var(--brace);color:#2a1205;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(255,138,61,.25)}
.bottone:active{transform:translateY(1px)}
.bottone.secondario{background:var(--pannello);color:var(--crema);box-shadow:none;border:1px solid var(--linea);font-weight:600}
.bottone.rosso{background:var(--rosso);color:#3a0a04;box-shadow:none}
#err{color:var(--rosso);min-height:1.4em;margin:0;font-size:14px}

/* ---------- app ---------- */
#app{display:none;height:100%}
#app.on{display:flex}
#side{width:270px;flex:none;background:var(--pannello);border-right:1px solid var(--linea);display:flex;flex-direction:column;padding:18px 14px;gap:22px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px}
.logo span{font-family:Georgia,serif;font-size:24px;font-weight:700}
.etichetta{font-size:12px;letter-spacing:.08em;text-transform:none;color:var(--sbiadito);margin:0 8px 8px;font-weight:600}
.stanza{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;color:var(--sbiadito);font-size:15px}
.stanza .ico{width:24px;text-align:center;font-size:16px}
.stanza:hover{background:rgba(255,138,61,.08);color:var(--crema)}
.stanza.on{background:rgba(255,138,61,.16);color:var(--crema);font-weight:700;box-shadow:inset 3px 0 0 var(--brace)}
#vox{background:var(--carbone);border:1px solid var(--linea);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#cerchio{width:92px;height:92px;border-radius:50%;background:var(--pannello);border:2px solid var(--linea);display:grid;place-items:center;font-size:34px;transition:box-shadow .3s,border-color .3s}
#vox.live #cerchio{border-color:var(--brace);box-shadow:0 0 0 6px rgba(255,138,61,.15),0 0 28px rgba(255,138,61,.45)}
#vox.parla #cerchio{animation:respira 1s ease-in-out infinite}
#vmsg{margin:0;font-size:14px;color:var(--sbiadito);min-height:2.6em}
.riga{display:flex;gap:8px;width:100%}
.riga .bottone{flex:1;padding:11px 10px;font-size:15px}
.persona{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none;font-family:Georgia,serif}
.persona .nome{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.persona .chip{font-size:12px;color:#2a1205;background:var(--brace);border-radius:999px;padding:2px 8px;font-weight:700}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:12px;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--linea);background:rgba(28,23,20,.6)}
#top h1{font-size:20px}
#top .sotto{font-size:13px;color:var(--sbiadito)}
#menu{display:none;background:var(--pannello);border:1px solid var(--linea);border-radius:10px;padding:6px 12px;color:var(--crema)}
#conn{margin-left:auto;font-size:13px;color:var(--rosso)}
#msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:12px;max-width:620px;animation:entra .25s ease-out}
.msg .testa{font-size:13px;color:var(--sbiadito);margin-bottom:4px}
.msg .testa b{color:var(--brace);font-family:Georgia,serif;margin-right:8px;font-size:14px}
.msg .corpo{background:var(--pannello);border:1px solid var(--linea);padding:10px 14px;border-radius:4px 18px 18px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mio{flex-direction:row-reverse;margin-left:auto}
.msg.mio .testa{text-align:right}
.msg.mio .testa b{color:var(--crema)}
.msg.mio .corpo{background:var(--brace-scuro);border-color:transparent;color:#fff6ee;border-radius:18px 4px 18px 18px}
.vuoto{margin:auto;color:var(--sbiadito);text-align:center;font-size:15px}
.vuoto .fiamma{font-size:44px;display:block;margin-bottom:8px}
#bar{display:flex;gap:10px;padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linea);background:rgba(28,23,20,.6)}
#txt{flex:1;min-width:0;background:var(--pannello);border:1px solid var(--linea);border-radius:22px;padding:12px 18px}
#txt:focus{border-color:var(--brace)}
#send{background:var(--brace);color:#2a1205;border:0;border-radius:22px;padding:0 20px;font-weight:700}

@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ondeggia{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-105%);transition:transform .25s;width:min(300px,86vw);padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:8px 0 30px rgba(0,0,0,.4)}
  #side.open{transform:none}
  #menu{display:block}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="join">
  <form id="jf">
    <div class="fiamma">🔥</div>
    <h1>Falò</h1>
    <p class="intro">Il posto dove si chiacchiera con gli amici, in chat e a voce.</p>
    <input id="name" placeholder="Come ti chiami?" maxlength="24" autocomplete="nickname" required>
    <input id="pass" type="password" placeholder="Parola d'ordine (se c'è)" autocomplete="off">
    <p id="err" role="alert"></p>
    <button class="bottone" type="submit">Entra nel falò</button>
  </form>
</div>

<div id="app">
  <aside id="side">
    <div class="logo"><span>🔥 Falò</span></div>

    <section>
      <p class="etichetta">Stanze</p>
      <div id="chs"></div>
    </section>

    <section>
      <p class="etichetta">Attorno al fuoco</p>
      <div id="vox">
        <div id="cerchio">🎙️</div>
        <p id="vmsg">Nessuno sta parlando.</p>
        <div class="riga">
          <button class="bottone" id="vjoin">Siediti</button>
          <button class="bottone secondario" id="vmute" hidden>Silenzia</button>
        </div>
      </div>
    </section>

    <section>
      <p class="etichetta" id="uh">Presenti</p>
      <div id="users"></div>
    </section>
  </aside>

  <main id="main">
    <header id="top">
      <button id="menu" aria-label="Apri il menu">☰</button>
      <div>
        <h1 id="title"></h1>
        <div class="sotto">Scrivi qualcosa per far sentire la tua voce</div>
      </div>
      <span id="conn"></span>
    </header>
    <div id="msgs"></div>
    <div id="bar">
      <input id="txt" placeholder="Scrivi un messaggio..." maxlength="1000" autocomplete="off">
      <button id="send">Invia</button>
    </div>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const ICE = [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }];
const TONI = ["#c85a1e","#7a5c3e","#b5452f","#8a6d2e","#5e6b3f","#9c4a6b","#3f6b6b","#6b4a8a"];

let ws, me = null, channels = [], history = {}, cur = "generale", users = [];
let creds = null, inVoice = false, localStream = null, muted = false;
const pcs = {}, audios = {};

/* ---------- utilità ---------- */
function tono(nome) {
  let h = 0;
  for (const c of nome) h = (h * 31 + c.charCodeAt(0)) % TONI.length;
  return TONI[h];
}
function avatar(nome) {
  const d = document.createElement("div");
  d.className = "avatar";
  d.style.background = tono(nome);
  d.textContent = (nome[0] || "?").toUpperCase();
  return d;
}
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

/* ---------- connessione ---------- */
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
  ws.onopen = () => { $("#conn").textContent = ""; send({ t: "join", name: creds.name, pass: creds.pass }); };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => {
    leaveVoice(false);
    if (!me) return;
    $("#conn").textContent = "Connessione persa, riprovo…";
    setTimeout(connect, 2000);
  };
}

function handle(m) {
  if (m.t === "denied") {
    $("#err").textContent = "Parola d'ordine sbagliata.";
    creds = null; ws.onclose = null; ws.close();
  } else if (m.t === "welcome") {
    me = { id: m.id, name: m.name };
    channels = m.channels; history = m.history;
    if (!channels.includes(cur)) cur = channels[0];
    $("#join").style.display = "none";
    $("#app").classList.add("on");
    renderChannels(); renderMsgs();
  } else if (m.t === "users") {
    users = m.users;
    renderUsers();
    for (const id of Object.keys(pcs)) {
      const u = users.find((x) => x.id === id);
      if (!u || !u.voice) closePeer(id);
    }
  } else if (m.t === "msg") {
    history[m.ch].push(m.m);
    if (m.ch === cur) renderMsgs();
  } else if (m.t === "voice-peers") {
    m.peers.forEach((id) => makePeer(id, true));
  } else if (m.t === "signal") {
    onSignal(m.from, m.data);
  }
}

/* ---------- interfaccia ---------- */
function renderChannels() {
  const box = $("#chs");
  box.innerHTML = "";
  channels.forEach((c) => {
    const b = document.createElement("button");
    b.className = "stanza" + (c === cur ? " on" : "");
    const ico = document.createElement("span");
    ico.className = "ico";
    ico.textContent = "🔥";
    b.append(ico, document.createTextNode(c));
    b.onclick = () => { cur = c; renderChannels(); renderMsgs(); $("#side").classList.remove("open"); };
    box.appendChild(b);
  });
  $("#title").textContent = cur.charAt(0).toUpperCase() + cur.slice(1);
}

function renderUsers() {
  const box = $("#users");
  box.innerHTML = "";
  users.forEach((u) => {
    const r = document.createElement("div");
    r.className = "persona";
    const n = document.createElement("span");
    n.className = "nome";
    n.textContent = u.name + (u.id === me.id ? " (tu)" : "");
    r.append(avatar(u.name), n);
    if (u.voice) {
      const t = document.createElement("span");
      t.className = "chip";
      t.textContent = "in voce";
      r.appendChild(t);
    }
    box.appendChild(r);
  });
  $("#uh").textContent = "Presenti (" + users.length + ")";
  const inCall = users.filter((u) => u.voice).map((u) => u.name);
  $("#vmsg").textContent = inCall.length ? "Attorno al fuoco: " + inCall.join(", ") : "Nessuno sta parlando.";
  $("#cerchio").parentElement.classList.toggle("parla", inCall.length > 0 && inVoice);
}

function renderMsgs() {
  const box = $("#msgs");
  const list = history[cur] || [];
  box.innerHTML = "";
  if (!list.length) {
    const e = document.createElement("div");
    e.className = "vuoto";
    e.innerHTML = '<span class="fiamma">🔥</span>Il fuoco è acceso.<br>Scrivi il primo messaggio.';
    box.appendChild(e);
    return;
  }
  list.forEach((m) => {
    const mio = me && m.uid === me.id;
    const row = document.createElement("div");
    row.className = "msg" + (mio ? " mio" : "");
    const col = document.createElement("div");
    col.style.maxWidth = "100%";
    const testa = document.createElement("div");
    testa.className = "testa";
    const b = document.createElement("b");
    b.textContent = mio ? "Tu" : m.user;
    testa.append(b, new Date(m.ts).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }));
    const corpo = document.createElement("div");
    corpo.className = "corpo";
    corpo.textContent = m.text;
    col.append(testa, corpo);
    row.append(avatar(mio ? me.name : m.user), col);
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const v = $("#txt").value.trim();
  if (!v) return;
  send({ t: "msg", ch: cur, text: v });
  $("#txt").value = "";
}

/* ---------- voce (WebRTC) ---------- */
async function joinVoice() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    $("#vmsg").textContent = "Il microfono non è disponibile. Controlla i permessi (serve HTTPS).";
    return;
  }
  inVoice = true; muted = false;
  $("#vox").classList.add("live");
  $("#vjoin").textContent = "Alzati";
  $("#vjoin").classList.replace("bottone", "bottone rosso");
  $("#vmute").hidden = false;
  $("#vmute").textContent = "Silenzia";
  send({ t: "voice-join" });
}

function leaveVoice(notify = true) {
  if (!inVoice) return;
  inVoice = false;
  Object.keys(pcs).forEach(closePeer);
  if (localStream) localStream.getTracks().forEach((t) => t.stop());
  localStream = null;
  $("#vox").classList.remove("live", "parla");
  $("#vjoin").textContent = "Siediti";
  $("#vjoin").classList.replace("bottone rosso", "bottone");
  $("#vmute").hidden = true;
  if (notify) send({ t: "voice-leave" });
}

function makePeer(id, initiator) {
  if (pcs[id]) return pcs[id];
  const pc = new RTCPeerConnection({ iceServers: ICE });
  pcs[id] = pc;
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  pc.onicecandidate = (e) => e.candidate && send({ t: "signal", to: id, data: { ice: e.candidate } });
  pc.ontrack = (e) => {
    let a = audios[id];
    if (!a) {
      a = document.createElement("audio");
      a.autoplay = true;
      a.playsInline = true;
      document.body.appendChild(a);
      audios[id] = a;
    }
    a.srcObject = e.streams[0];
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "failed") closePeer(id);
  };
  if (initiator) {
    pc.createOffer()
      .then((o) => pc.setLocalDescription(o))
      .then(() => send({ t: "signal", to: id, data: { sdp: pc.localDescription } }));
  }
  return pc;
}

async function onSignal(from, data) {
  if (!inVoice) return;
  const pc = pcs[from] || makePeer(from, false);
  try {
    if (data.sdp) {
      await pc.setRemoteDescription(data.sdp);
      if (data.sdp.type === "offer") {
        await pc.setLocalDescription(await pc.createAnswer());
        send({ t: "signal", to: from, data: { sdp: pc.localDescription } });
      }
    } else if (data.ice) {
      await pc.addIceCandidate(data.ice);
    }
  } catch (e) {}
}

function closePeer(id) {
  if (pcs[id]) { pcs[id].close(); delete pcs[id]; }
  if (audios[id]) { audios[id].srcObject = null; audios[id].remove(); delete audios[id]; }
}

/* ---------- eventi ---------- */
$("#jf").addEventListener("submit", (e) => {
  e.preventDefault();
  $("#err").textContent = "";
  creds = { name: $("#name").value.trim(), pass: $("#pass").value };
  try { localStorage.setItem("falo-nome", creds.name); } catch (e) {}
  connect();
});
$("#send").onclick = sendMsg;
$("#txt").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
$("#menu").onclick = () => $("#side").classList.toggle("open");
$("#vjoin").onclick = () => (inVoice ? leaveVoice() : joinVoice());
$("#vmute").onclick = () => {
  muted = !muted;
  localStream.getAudioTracks().forEach((t) => (t.enabled = !muted));
  $("#vmute").textContent = muted ? "Riattiva" : "Silenzia";
};
try { $("#name").value = localStorage.getItem("falo-nome") || ""; } catch (e) {}
</script>
</body>
</html>
