<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Chat Futuristica</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #05070d;
      --vetro: rgba(14, 22, 40, 0.62);
      --bordo: rgba(0, 229, 255, 0.18);
      --ciano: #00e5ff;
      --viola: #b400ff;
      --testo: #e6f7ff;
      --sbiadito: #6f85a6;
      --rosso: #ff3d7f;
      --oro: #ffd700;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--testo);
      overflow: hidden;
      background: radial-gradient(circle at 20% 50%, rgba(0, 229, 255, 0.1), transparent),
                  radial-gradient(circle at 80% 80%, rgba(180, 0, 255, 0.1), transparent),
                  var(--bg);
    }

    /* === LOGIN === */
    #loginModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    #loginModal.hidden {
      display: none;
    }

    .loginBox {
      background: var(--vetro);
      border: 2px solid var(--viola);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 400px;
      backdrop-filter: blur(10px);
      text-align: center;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .loginBox h1 {
      font-size: 32px;
      margin-bottom: 30px;
      background: linear-gradient(135deg, var(--ciano), var(--viola));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    .loginBox input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: rgba(0, 229, 255, 0.05);
      border: 2px solid var(--bordo);
      border-radius: 10px;
      color: var(--testo);
      font-size: 16px;
      transition: all 0.3s;
    }

    .loginBox input:focus {
      outline: none;
      border-color: var(--ciano);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      background: rgba(0, 229, 255, 0.1);
    }

    .loginBox button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--ciano), var(--viola));
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .loginBox button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 229, 255, 0.3);
    }

    .loginError {
      color: var(--rosso);
      margin-top: 15px;
      font-size: 14px;
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    /* === MAIN === */
    #app {
      display: flex;
      height: 100vh;
      gap: 10px;
      padding: 10px;
    }

    #app.hidden {
      display: none;
    }

    /* === SIDEBAR === */
    #side {
      width: 220px;
      background: var(--vetro);
      border: 1px solid var(--bordo);
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .sideHeader {
      padding: 15px;
      border-bottom: 1px solid var(--bordo);
      font-weight: 600;
      font-size: 14px;
      color: var(--ciano);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .channels {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .channel {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 5px;
      transition: all 0.3s;
      font-size: 14px;
      border-left: 3px solid transparent;
    }

    .channel:hover {
      background: rgba(0, 229, 255, 0.1);
    }

    .channel.active {
      background: rgba(0, 229, 255, 0.2);
      border-left-color: var(--ciano);
      color: var(--ciano);
      font-weight: 600;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }

    .users {
      border-top: 1px solid var(--bordo);
      padding: 10px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 12px;
    }

    .userItem {
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 5px;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid var(--bordo);
      display: flex;
      justify-content: space-between;
      align-items: center;
      word-break: break-word;
    }

    .userAdmin {
      color: var(--oro);
      font-weight: 600;
    }

    .userActions {
      display: flex;
      gap: 3px;
      font-size: 11px;
    }

    .userActions button {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--bordo);
      color: var(--testo);
      padding: 2px 5px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .userActions button:hover {
      background: var(--rosso);
      border-color: var(--rosso);
    }

    .sideFooter {
      padding: 10px;
      border-top: 1px solid var(--bordo);
      font-size: 12px;
      text-align: center;
      color: var(--sbiadito);
    }

    .sideFooter input {
      width: 100%;
      padding: 6px;
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid var(--bordo);
      border-radius: 6px;
      color: var(--testo);
      margin-top: 5px;
      font-size: 12px;
    }

    .sideFooter button {
      width: 100%;
      padding: 6px;
      background: var(--rosso);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px;
      transition: all 0.3s;
    }

    .sideFooter button:hover {
      background: #ff2563;
    }

    /* === MAIN CONTENT === */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #top {
      background: var(--vetro);
      border: 1px solid var(--bordo);
      border-radius: 15px;
      padding: 15px;
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chName {
      font-size: 18px;
      font-weight: 700;
      color: var(--ciano);
      text-transform: capitalize;
    }

    .topRa {
      display: flex;
      gap: 10px;
    }

    .topBtn {
      padding: 8px 15px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--bordo);
      border-radius: 8px;
      color: var(--ciano);
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
      font-weight: 600;
    }

    .topBtn:hover {
      background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    /* === CHAT === */
    #msgs {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      border: 1px solid var(--bordo);
    }

    .msg {
      background: var(--vetro);
      border: 2px solid var(--bordo);
      border-radius: 10px;
      padding: 12px;
      backdrop-filter: blur(5px);
      animation: msgIn 0.3s ease;
      word-wrap: break-word;
    }

    .msg.own {
      border-color: var(--viola);
      margin-left: 20px;
    }

    .msg.admin {
      border-color: var(--oro);
    }

    .sysMsg {
      text-align: center;
      font-size: 12px;
      color: var(--sbiadito);
      padding: 8px;
      font-style: italic;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msgHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .msgName {
      font-weight: 700;
      color: var(--ciano);
    }

    .msgName.admin {
      color: var(--oro);
    }

    .msgTime {
      font-size: 11px;
      color: var(--sbiadito);
    }

    .msgText {
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .msgActions {
      margin-top: 6px;
      display: flex;
      gap: 5px;
      font-size: 11px;
    }

    .msgActions button {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--bordo);
      color: var(--testo);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .msgActions button:hover {
      background: var(--rosso);
      border-color: var(--rosso);
    }

    /* === INPUT === */
    #input {
      display: flex;
      gap: 8px;
      background: var(--vetro);
      border: 1px solid var(--bordo);
      border-radius: 15px;
      padding: 10px;
      backdrop-filter: blur(10px);
    }

    #msgInput {
      flex: 1;
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid var(--bordo);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--testo);
      font-size: 14px;
      transition: all 0.3s;
    }

    #msgInput:focus {
      outline: none;
      border-color: var(--ciano);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      background: rgba(0, 229, 255, 0.08);
    }

    #send {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--ciano), var(--viola));
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    #send:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 229, 255, 0.4);
    }

    /* === VOICE/VIDEO === */
    #voiceSection {
      display: flex;
      gap: 8px;
      background: var(--vetro);
      border: 1px solid var(--bordo);
      border-radius: 15px;
      padding: 10px;
      backdrop-filter: blur(10px);
    }

    .voiceBtn {
      padding: 10px 15px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--bordo);
      border-radius: 8px;
      color: var(--ciano);
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }

    .voiceBtn:hover {
      background: rgba(0, 229, 255, 0.2);
    }

    .voiceBtn.attivo {
      background: var(--rosso);
      border-color: var(--rosso);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 61, 127, 0.5);
    }

    #vids {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      border: 1px solid var(--bordo);
      padding: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      border: 2px solid var(--viola);
    }

    video.remote {
      border-color: var(--ciano);
    }

    /* === SCROLLBAR === */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 229, 255, 0.05);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.3);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 229, 255, 0.5);
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      #app {
        flex-direction: column;
      }

      #side {
        width: 100%;
        max-height: 120px;
      }

      .channels {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .channel {
        white-space: nowrap;
        flex-shrink: 0;
      }

      #msgInput {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

<!-- LOGIN MODAL -->
<div id="loginModal">
  <div class="loginBox">
    <h1>NEXUS</h1>
    <input type="text" id="loginName" placeholder="Nome utente" autofocus>
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Entra</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <!-- SIDEBAR -->
  <div id="side">
    <div class="sideHeader">Canali</div>
    <div class="channels" id="channels"></div>
    
    <div class="users">
      <div style="font-weight: 600; color: var(--ciano); font-size: 11px; margin-bottom: 8px; text-transform: uppercase;">Online</div>
      <div id="userList"></div>
    </div>

    <div class="sideFooter">
      <div id="myName" style="font-weight: 600; color: var(--ciano); margin-bottom: 5px;"></div>
      <button onclick="logout()" style="background: var(--rosso);">Esci</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main">
    <!-- TOP BAR -->
    <div id="top">
      <div id="chName"># generale</div>
      <div class="topRa">
        <button class="topBtn" id="vjoin">🎙️ Voce</button>
        <button class="topBtn" id="vcam" hidden>📹 Camera</button>
        <button class="topBtn" id="vmute" hidden>🔇 Muta</button>
        <button class="topBtn" id="settingBtn" hidden>⚙️ Impostazioni</button>
      </div>
    </div>

    <!-- MESSAGES -->
    <div id="msgs"></div>

    <!-- INPUT -->
    <div id="input">
      <input type="text" id="msgInput" placeholder="Scrivi un messaggio...">
      <button id="send">Invia</button>
    </div>

    <!-- VOICE/VIDEO -->
    <div id="voiceSection">
      <div id="vids"></div>
    </div>
  </div>
</div>

<script>
  // CONFIG
  const API = location.protocol === "https:" ? "wss://" : "ws://";
  const WS_URL = API + location.host;

  // STATE
  let me = { id: null, name: null, admin: false };
  let channel = "generale";
  let inVoice = false;
  let inVoiceCall = false;
  let mutedMic = false;
  let mutedCam = false;
  let peers = {};
  let localStream = null;
  let ws = null;

  // === LOGIN ===
  function login() {
    const name = document.getElementById("loginName").value.trim();
    const pass = document.getElementById("loginPass").value;

    if (!name || !pass) {
      showError("Nome e password obbligatori");
      return;
    }

    connect(name, pass);
  }

  function showError(msg) {
    const err = document.getElementById("loginError");
    err.textContent = msg;
    setTimeout(() => { err.textContent = ""; }, 4000);
  }

  // === WEBSOCKET ===
  function connect(name, pass) {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        type: "join",
        name,
        password: pass,
        channel
      }));
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      handle(msg);
    };

    ws.onerror = () => {
      showError("Errore connessione");
    };

    ws.onclose = () => {
      showError("Disconnesso");
      document.getElementById("app").classList.add("hidden");
      document.getElementById("loginModal").classList.remove("hidden");
    };
  }

  function handle(msg) {
    switch (msg.type) {
      case "welcome":
        handleWelcome(msg);
        break;
      case "denied":
        showError(msg.reason);
        break;
      case "msg":
        addMsg(msg);
        break;
      case "msgDeleted":
        deleteMsg(msg.msgId);
        break;
      case "sysMsg":
        addSysMsg(msg.text);
        break;
      case "userJoined":
        addUser(msg);
        break;
      case "userLeft":
        removeUser(msg.id);
        break;
      case "kicked":
        showError("Sei stato kickato!");
        ws.close();
        break;
      case "muted":
        mutedMic = true;
        updateVoiceButtons();
        showError("Sei stato mutato!");
        break;
      case "unmuted":
        mutedMic = false;
        updateVoiceButtons();
        break;
      case "camDisabled":
        mutedCam = true;
        updateVoiceButtons();
        showError("La tua camera è stata disabilitata!");
        break;
      case "voice-peers":
        handleVoicePeers(msg.peers);
        break;
      case "newVoicePeer":
        createPeer(msg.id, msg.name, true);
        break;
      case "signal":
        handleSignal(msg);
        break;
    }
  }

  function handleWelcome(msg) {
    me.id = msg.id;
    me.admin = msg.admin;

    document.getElementById("loginModal").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("myName").textContent = (msg.admin ? "👑 " : "") + me.name;

    msg.channels.forEach(ch => {
      const el = document.createElement("div");
      el.className = "channel" + (ch === channel ? " active" : "");
      el.textContent = "#" + ch;
      el.onclick = () => switchChannel(ch);
      document.getElementById("channels").appendChild(el);
    });

    updateUsers(msg.users);
    msg.messages.forEach(m => addMsg(m));
    autoScroll();
  }

  // === CHAT ===
  function addMsg(m) {
    const el = document.createElement("div");
    el.className = "msg";
    if (m.from === me.id) el.classList.add("own");
    if (m.admin) el.classList.add("admin");

    const header = document.createElement("div");
    header.className = "msgHeader";
    header.innerHTML = `
      <span class="msgName${m.admin ? " admin" : ""}">${m.admin ? "👑 " : ""}${m.name}</span>
      <span class="msgTime">${new Date(m.time).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })}</span>
    `;

    const text = document.createElement("div");
    text.className = "msgText";
    text.textContent = m.text;

    const actions = document.createElement("div");
    actions.className = "msgActions";

    // Pulsante cancella
    if (m.from === me.id || me.admin) {
      const delBtn = document.createElement("button");
      delBtn.textContent = "🗑️ Cancella";
      delBtn.onclick = () => {
        ws.send(JSON.stringify({
          type: "deleteMsg",
          msgId: m.id,
          channel
        }));
      };
      actions.appendChild(delBtn);
    }

    el.appendChild(header);
    el.appendChild(text);
    if (actions.children.length > 0) el.appendChild(actions);

    el.id = "msg-" + m.id;
    document.getElementById("msgs").appendChild(el);
    autoScroll();
  }

  function deleteMsg(msgId) {
    const el = document.getElementById("msg-" + msgId);
    if (el) el.remove();
  }

  function addSysMsg(text) {
    const el = document.createElement("div");
    el.className = "sysMsg";
    el.textContent = text;
    document.getElementById("msgs").appendChild(el);
    autoScroll();
  }

  document.getElementById("send").onclick = () => {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text) return;

    ws.send(JSON.stringify({
      type: "msg",
      text,
      channel
    }));

    input.value = "";
  };

  document.getElementById("msgInput").onkeypress = (e) => {
    if (e.key === "Enter") document.getElementById("send").click();
  };

  // === CHANNELS ===
  function switchChannel(ch) {
    channel = ch;
    document.querySelectorAll(".channel").forEach(c => c.classList.remove("active"));
    event.target.classList.add("active");
    document.getElementById("chName").textContent = "#" + ch;
    document.getElementById("msgs").innerHTML = "";
  }

  // === USERS ===
  function addUser(u) {
    updateUsers([u]);
  }

  function removeUser(id) {
    const el = document.getElementById("user-" + id);
    if (el) el.remove();
  }

  function updateUsers(users) {
    const list = document.getElementById("userList");
    list.innerHTML = "";
    users.forEach(u => {
      const el = document.createElement("div");
      el.className = "userItem";
      el.id = "user-" + u.id;
      el.innerHTML = `
        <span class="${u.admin ? "userAdmin" : ""}">${u.admin ? "👑 " : ""}${u.name}</span>
      `;

      // Pulsanti admin
      if (me.admin) {
        const actions = document.createElement("div");
        actions.className = "userActions";

        const kickBtn = document.createElement("button");
        kickBtn.textContent = "⛔";
        kickBtn.title = "Kicka";
        kickBtn.onclick = () => {
          ws.send(JSON.stringify({
            type: "kick",
            targetId: u.id
          }));
        };

        const muteBtn = document.createElement("button");
        muteBtn.textContent = "🔇";
        muteBtn.title = "Muta";
        muteBtn.onclick = () => {
          ws.send(JSON.stringify({
            type: "mute",
            targetId: u.id
          }));
        };

        const camBtn = document.createElement("button");
        camBtn.textContent = "📵";
        camBtn.title = "Camera off";
        camBtn.onclick = () => {
          ws.send(JSON.stringify({
            type: "toggleCam",
            targetId: u.id
          }));
        };

        actions.appendChild(kickBtn);
        actions.appendChild(muteBtn);
        actions.appendChild(camBtn);
        el.appendChild(actions);
      }

      list.appendChild(el);
    });
  }

  // === VOICE ===
  document.getElementById("vjoin").onclick = async () => {
    if (inVoice) {
      leaveVoice();
    } else {
      await joinVoice();
    }
  };

  async function joinVoice() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      inVoice = true;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        localStream.getTracks().forEach(t => {
          if (t.kind === "video") localStream.addTrack(t);
        });
      } catch (e) {
        console.log("Camera non disponibile");
      }

      ws.send(JSON.stringify({ type: "voice-join" }));
      updateVoiceButtons();
    } catch (e) {
      showError("Microfono non disponibile: " + e.message);
    }
  }

  function leaveVoice() {
    inVoice = false;
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    Object.keys(peers).forEach(id => {
      if (peers[id].pc) peers[id].pc.close();
    });
    peers = {};
    document.getElementById("vids").innerHTML = "";
    ws.send(JSON.stringify({ type: "voice-leave" }));
    updateVoiceButtons();
  }

  function updateVoiceButtons() {
    const vjoin = document.getElementById("vjoin");
    const vcam = document.getElementById("vcam");
    const vmute = document.getElementById("vmute");

    if (inVoice) {
      vjoin.classList.add("attivo");
      vjoin.textContent = "🎙️ Esci";
      vcam.classList.remove("hidden");
      vmute.classList.remove("hidden");
    } else {
      vjoin.classList.remove("attivo");
      vjoin.textContent = "🎙️ Voce";
      vcam.classList.add("hidden");
      vmute.classList.add("hidden");
      document.getElementById("vids").innerHTML = "";
    }
  }

  // === WebRTC ===
  function handleVoicePeers(peers) {
    peers.forEach(p => {
      if (p.id !== me.id) createPeer(p.id, p.name, true);
    });
  }

  function createPeer(id, name, initiator) {
    if (peers[id]) return;

    const pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    });

    peers[id] = { id, name, pc };

    if (localStream) {
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    }

    pc.ontrack = (e) => {
      addRemoteVideo(id, name, e.streams[0]);
    };

    pc.onicecandidate = (e) => {
      if (e.candidate) {
        ws.send(JSON.stringify({
          type: "signal",
          to: id,
          data: { type: "candidate", candidate: e.candidate }
        }));
      }
    };

    if (initiator) {
      pc.createOffer().then(offer => {
        pc.setLocalDescription(offer);
        ws.send(JSON.stringify({
          type: "signal",
          to: id,
          data: { type: "offer", offer }
        }));
      });
    }

    return pc;
  }

  function handleSignal(msg) {
    const { from, data } = msg;
    let pc = peers[from]?.pc;

    if (!pc) {
      pc = createPeer(from, peers[from]?.name || from, false);
    }

    if (data.type === "offer") {
      pc.setRemoteDescription(new RTCSessionDescription(data.offer)).then(() => {
        pc.createAnswer().then(answer => {
          pc.setLocalDescription(answer);
          ws.send(JSON.stringify({
            type: "signal",
            to: from,
            data: { type: "answer", answer }
          }));
        });
      });
    } else if (data.type === "answer") {
      pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    } else if (data.type === "candidate") {
      pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    }
  }

  function addRemoteVideo(id, name, stream) {
    const vids = document.getElementById("vids");
    let video = document.getElementById("video-" + id);
    if (!video) {
      video = document.createElement("video");
      video.id = "video-" + id;
      video.className = "remote";
      video.autoplay = true;
      video.playsinline = true;
      video.muted = false;
      vids.appendChild(video);
    }
    video.srcObject = stream;
  }

  function autoScroll() {
    const msgs = document.getElementById("msgs");
    msgs.scrollTop = msgs.scrollHeight;
  }

  function logout() {
    if (confirm("Esci davvero?")) {
      leaveVoice();
      if (ws) ws.close();
      location.reload();
    }
  }

  // INIT
  document.getElementById("loginName").focus();
</script>
